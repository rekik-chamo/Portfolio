name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files found"
